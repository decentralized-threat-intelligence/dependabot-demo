version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "eval/dependabot"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 50

  - package-ecosystem: "npm"
    directory: "/javascript"
    target-branch: "eval/dependabot"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 50

  - package-ecosystem: "bundler"
    directory: "/ruby"
    target-branch: "eval/dependabot"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 50
